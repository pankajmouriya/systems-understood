name: Deploy Cloudflare Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified production artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Download verified Pages artifact
        uses: actions/download-artifact@v7
        with:
          name: cloudflare-pages-out
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID variable}"
          : "${CLOUDFLARE_PROJECT_NAME:?Missing CLOUDFLARE_PROJECT_NAME variable}"

      - name: Ensure Pages project exists
        shell: bash
        run: |
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          project_file="${RUNNER_TEMP}/cloudflare-pages-project.json"
          project_status="$(curl --silent --show-error \
            --output "${project_file}" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${project_url}")"

          if [[ "${project_status}" == "404" ]]; then
            npx --yes wrangler@4.149.0 pages project create "${CLOUDFLARE_PROJECT_NAME}" --production-branch main
          elif [[ "${project_status}" != "200" ]]; then
            echo "Cloudflare project lookup failed with HTTP ${project_status}."
            exit 1
          else
            jq -e --arg name "${CLOUDFLARE_PROJECT_NAME}" \
              '.success == true and .result.name == $name' \
              "${project_file}" >/dev/null
          fi

      - name: Deploy production
        run: >-
          npx --yes wrangler@4.149.0 pages deploy out
          --project-name "${CLOUDFLARE_PROJECT_NAME}"
          --branch main
          --commit-hash "${{ github.event.workflow_run.head_sha }}"
          --commit-dirty=false

      - name: Attach production domain
        shell: bash
        run: |
          domains_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains"
          domains_file="${RUNNER_TEMP}/cloudflare-pages-domains.json"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${domains_url}" > "${domains_file}"

          if ! jq -e 'any(.result[]; .name == "pankajmouriya.com")' "${domains_file}" >/dev/null; then
            create_file="${RUNNER_TEMP}/cloudflare-pages-domain-create.json"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"pankajmouriya.com"}' \
              "${domains_url}" > "${create_file}"
            jq -e '.success == true' "${create_file}" >/dev/null
          fi

